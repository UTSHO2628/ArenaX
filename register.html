<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Team | ArenaX</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand">Arena<span>X</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="register.html" class="active">Register Team</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="card" style="max-width: 800px; margin: 2rem auto;">
      <h2 class="text-center mb-2">Register Your Team</h2>
      
      <div id="formAlert" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="segmentSelect">Select Segment</label>
          <select id="segmentSelect" class="form-control" required>
            <option value="">Loading segments...</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="teamName">Team Name</label>
          <input type="text" id="teamName" class="form-control" required placeholder="e.g. RoboKings">
        </div>
        
        <div class="form-group">
          <label for="contactEmail">Contact Email (for Admin follow-up)</label>
          <input type="email" id="contactEmail" class="form-control" required placeholder="leader@university.edu">
        </div>

        <h3 class="mt-2" style="font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">Team Members (Minimum 4 required)</h3>
        
        <div id="membersContainer">
          <!-- Member rows injected via JS -->
        </div>
        
        <div class="mb-2">
          <button type="button" id="addMemberBtn" class="btn btn-secondary">+ Add Member</button>
        </div>
        
        <div class="mt-2 text-center" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 2rem;">
          <button type="submit" id="submitBtn" class="btn btn-primary" style="padding: 1rem 3rem; font-size: 1.1rem;">Submit Registration</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/register.js"></script>
</body>
</html>
